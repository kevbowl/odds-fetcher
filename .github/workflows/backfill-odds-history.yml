name: Backfill Odds History

on:
  workflow_dispatch:
    inputs:
      start_utc:
        description: Inclusive five-minute UTC bucket at which to start
        required: true
        default: '2026-08-06T15:35:00Z'
      end_utc:
        description: Inclusive five-minute UTC bucket at which to stop
        required: true
        default: '2026-08-06T22:00:00Z'
      max_credits:
        description: Hard ceiling for provider-reported historical credits
        required: true
        default: '10000'
      execute:
        description: Spend credits, append recovered commits, and push main
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: odds-writes
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout complete repository history
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm install

    - name: Test fetch and backfill contracts
      run: npm test

    - name: Plan missing snapshots
      env:
        BACKFILL_START_UTC: ${{ inputs.start_utc }}
        BACKFILL_END_UTC: ${{ inputs.end_utc }}
      run: node backfill-odds.js

    - name: Fetch historical snapshots and append commits
      if: ${{ inputs.execute }}
      env:
        ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        BACKFILL_START_UTC: ${{ inputs.start_utc }}
        BACKFILL_END_UTC: ${{ inputs.end_utc }}
        BACKFILL_MAX_CREDITS: ${{ inputs.max_credits }}
        BACKFILL_EXECUTE: 'true'
      run: node backfill-odds.js

    - name: Rebase and push recovered history
      if: ${{ inputs.execute }}
      run: |
        git pull --rebase origin main
        git push origin main
