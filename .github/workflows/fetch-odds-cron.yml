name: Fetch Odds Cron

on:
  workflow_dispatch:

concurrency:
  group: odds-writes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch-odds:
    runs-on: ubuntu-24.04
    timeout-minutes: 4

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        # workflow_dispatch pins GITHUB_SHA when the request is created. A
        # queued job must resolve main again when it actually starts so it does
        # not fetch and commit from a stale odds snapshot.
        ref: main

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '18'

    - name: Test receipt contracts
      run: node fetch-odds.test.js

    - name: Fetch odds
      env:
        ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      run: node fetch-odds.js

    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add odds/
        if git diff --staged --quiet; then
          echo "No odds changes to commit"
          exit 0
        fi

        git commit -m "Update odds - $(date)"

        for attempt in 1 2 3; do
          if ! git pull --rebase origin main; then
            if git rev-parse -q --verify REBASE_HEAD >/dev/null; then
              git rebase --abort
              echo "A newer odds snapshot reached main; discarding this stale snapshot."
              exit 0
            fi
            echo "Pull failed before rebase; retrying..."
            sleep 5
            continue
          fi
          if git push origin main; then
            exit 0
          fi
          echo "Push failed; retrying after fetching latest main..."
          sleep 5
        done

        echo "Failed to push odds update after retries"
        exit 1
