name: Fetch Odds Cron

on:
  workflow_dispatch:

concurrency:
  group: odds-writes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch-odds:
    runs-on: ubuntu-24.04
    timeout-minutes: 4

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        # workflow_dispatch pins GITHUB_SHA when the request is created. A
        # queued job must resolve main again when it actually starts so it does
        # not fetch and commit from a stale odds snapshot.
        ref: main

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '18'

    - name: Test receipt contracts
      run: npm test

    - name: Capture exact publication parent
      id: publication
      run: printf 'parent=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Fetch odds
      env:
        ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        ODDS_PUBLICATION_PARENT: ${{ steps.publication.outputs.parent }}
      run: node fetch-odds.js

    - name: Commit and push changes
      env:
        ODDS_PUBLICATION_PARENT: ${{ steps.publication.outputs.parent }}
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        bash scripts/publish-odds.sh
